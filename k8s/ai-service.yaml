apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: hiresmart
spec:
  selector: { app: ai-service }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: hiresmart
spec:
  replicas: 2
  selector:
    matchLabels: { app: ai-service }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: ai-service, tier: ai }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ai-service
          image: ghcr.io/OWNER/hiresmart-ai/ai-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: hiresmart-config }
          env:
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: hiresmart-secrets, key: AI_SERVICE_TOKEN } }
            - name: GROQ_API_KEY
              valueFrom: { secretKeyRef: { name: hiresmart-secrets, key: GROQ_API_KEY, optional: true } }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 2560Mi }
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
