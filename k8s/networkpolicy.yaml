# Default-deny ingress, then open only the paths the app needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: hiresmart
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: hiresmart
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [frontend, backend] }
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-to-backend
  namespace: hiresmart
spec:
  podSelector: { matchLabels: { app: backend } }
  ingress:
    - from:
        - podSelector: { matchLabels: { app: frontend } }
      ports: [{ port: 5000 }]
---
# Only the backend may call the AI service or the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-to-ai
  namespace: hiresmart
spec:
  podSelector: { matchLabels: { app: ai-service } }
  ingress:
    - from:
        - podSelector: { matchLabels: { app: backend } }
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-to-mongo
  namespace: hiresmart
spec:
  podSelector: { matchLabels: { app: mongo } }
  ingress:
    - from:
        - podSelector: { matchLabels: { app: backend } }
      ports: [{ port: 27017 }]
