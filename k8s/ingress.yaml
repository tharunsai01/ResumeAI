apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hiresmart
  namespace: hiresmart
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt # if cert-manager is installed
spec:
  ingressClassName: nginx
  tls:
    - hosts: [hiresmart.example.com]
      secretName: hiresmart-tls
  rules:
    - host: hiresmart.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 5000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 8080 } }
