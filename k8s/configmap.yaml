apiVersion: v1
kind: ConfigMap
metadata:
  name: hiresmart-config
  namespace: hiresmart
data:
  NODE_ENV: production
  PORT: "5000"
  AI_SERVICE_URL: http://ai-service:8000
  CORS_ORIGINS: https://hiresmart.example.com
  FRONTEND_URL: https://hiresmart.example.com
  PUBLIC_API_URL: https://hiresmart.example.com
  TRUST_PROXY: "1"
  UPLOAD_DIR: /app/uploads
  LOG_LEVEL: info
  ENVIRONMENT: production
  GROQ_MODEL: openai/gpt-oss-20b
  EMBEDDINGS_ENABLED: "true"
