apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hiresmart
resources:
  - namespace.yaml
  - configmap.yaml
  - mongodb.yaml        # remove when using a managed MongoDB
  - ai-service.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - hpa.yaml
# The hiresmart-secrets Secret is created out of band (see secret.example.yaml)
