# NOT applied by kustomize. Create the real secret out of band, for example:
#   kubectl -n hiresmart create secret generic hiresmart-secrets \
#     --from-literal=MONGO_URI='mongodb://user:pass@mongo:27017/hiresmart?authSource=admin' \
#     --from-literal=MONGO_ROOT_USER=hiresmart --from-literal=MONGO_ROOT_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=JWT_ACCESS_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=AI_SERVICE_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=GROQ_API_KEY='' \
#     --from-literal=GOOGLE_CLIENT_ID='' --from-literal=GOOGLE_CLIENT_SECRET='' \
#     --from-literal=LINKEDIN_CLIENT_ID='' --from-literal=LINKEDIN_CLIENT_SECRET=''
# To use a managed database (MongoDB Atlas, Cosmos DB for MongoDB), point MONGO_URI
# at it and remove mongodb.yaml from kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: hiresmart-secrets
  namespace: hiresmart
type: Opaque
stringData:
  MONGO_URI: mongodb://hiresmart:CHANGE_ME@mongo:27017/hiresmart?authSource=admin
  MONGO_ROOT_USER: hiresmart
  MONGO_ROOT_PASSWORD: CHANGE_ME
  JWT_ACCESS_SECRET: CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG
  JWT_REFRESH_SECRET: CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG_TOO
  AI_SERVICE_TOKEN: CHANGE_ME_SHARED_TOKEN
  GROQ_API_KEY: ""
