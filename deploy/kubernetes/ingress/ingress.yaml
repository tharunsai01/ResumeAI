apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resumeai
  namespace: resumeai-capstone
spec:
  tls:
    - hosts:
        - resumeai.example.com
      secretName: resumeai-tls
  rules:
    - host: resumeai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
