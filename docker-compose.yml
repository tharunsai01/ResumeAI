services:
  # -------------------------------------------------------------
  # 1. MongoDB Database
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: hiresmart
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 20s
      retries: 8
      start_period: 25s
    networks:
      - hiresmart-network

  # -------------------------------------------------------------
  # 2. Node.js Express Main Backend
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/hiresmart
      - CLIENT_URL=${CLIENT_URL:-http://localhost:${FRONTEND_PORT:-5173}}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-hiresmart_jwt_access_super_secret_key_2026_xyz}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-hiresmart_jwt_refresh_super_secret_key_2026_abc}
      - JWT_ACCESS_MINUTES=15
      - JWT_REFRESH_DAYS=7
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_KEY=${AI_SERVICE_KEY:?Set AI_SERVICE_KEY in the root .env}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - hiresmart-network

  # -------------------------------------------------------------
  # 3. Vite React Frontend
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
        - VITE_USE_MOCK=false
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - hiresmart-network

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:?Set AI_SERVICE_KEY in the root .env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hiresmart-network

volumes:
  mongodb_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  hiresmart-network:
    driver: bridge
