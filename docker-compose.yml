version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. MongoDB Database
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: hiresmart-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hiresmart
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hiresmart-network

  # -------------------------------------------------------------
  # 2. Node.js Express Main Backend
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiresmart-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/hiresmart
      - CLIENT_URL=http://localhost:5173
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-hiresmart_jwt_access_super_secret_key_2026_xyz}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-hiresmart_jwt_refresh_super_secret_key_2026_abc}
      - JWT_ACCESS_MINUTES=15
      - JWT_REFRESH_DAYS=7
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - hiresmart-network

  # -------------------------------------------------------------
  # 3. Vite React Frontend
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
        - VITE_USE_MOCK=false
    container_name: hiresmart-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - hiresmart-network

volumes:
  mongodb_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  hiresmart-network:
    driver: bridge
