<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-log" style="position: fixed; top: 0; left: 0; right: 0; background: red; color: white; padding: 20px; z-index: 9999; display: none; font-family: monospace; white-space: pre-wrap;"></div>
    <script>
      window.addEventListener('error', function(event) {
        var log = document.getElementById('error-log');
        log.style.display = 'block';
        log.innerHTML += 'Error: ' + event.message + '\n' + (event.error && event.error.stack ? event.error.stack : '') + '\n\n';
      });
      window.addEventListener('unhandledrejection', function(event) {
        var log = document.getElementById('error-log');
        log.style.display = 'block';
        log.innerHTML += 'Promise Rejection: ' + event.reason + '\n\n';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
