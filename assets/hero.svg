<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HireSmart AI – Resume Intelligence Platform" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18"><animate attributeName="stop-color" values="#070B18;#0B1233;#070B18" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="0.55" stop-color="#172554"><animate attributeName="stop-color" values="#172554;#312E81;#172554" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#4F46E5"><animate attributeName="stop-color" values="#4F46E5;#06B6D4;#4F46E5" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <!-- floating aurora orbs -->
    <circle r="130" fill="#06B6D4" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" values="180;320;180" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;230;90" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle r="150" fill="#8B5CF6" opacity="0.38" filter="url(#blur)">
      <animate attributeName="cx" values="1010;860;1010" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;110;260" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="110" fill="#4F46E5" opacity="0.4" filter="url(#blur)">
      <animate attributeName="cx" values="600;700;600" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="330;290;330" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- rising particles -->
    <g fill="#A5F3FC" filter="url(#glow)">
      <circle cx="120" cy="340" r="2"><animate attributeName="cy" values="360;-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="340" r="1.6"><animate attributeName="cy" values="360;-10" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="340" r="2.2"><animate attributeName="cy" values="360;-10" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="340" r="1.8"><animate attributeName="cy" values="360;-10" dur="10s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="340" r="2"><animate attributeName="cy" values="360;-10" dur="8.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8.5s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="340" r="1.6"><animate attributeName="cy" values="360;-10" dur="9.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- badge pill -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
      <rect x="425" y="62" width="350" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#67E8F9" stroke-opacity="0.5"/>
      <circle cx="450" cy="79" r="4" fill="#34D399"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="606" y="84" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#A5F3FC">RESUME INTELLIGENCE PLATFORM</text>
    </g>

    <!-- title -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1.2s" begin="0.4s" fill="freeze"/>
      <text x="600" y="190" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)" filter="url(#glow)">HireSmart AI</text>
    </g>

    <!-- subtitle -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="1s" fill="freeze"/>
      <text x="600" y="240" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="500" letter-spacing="4" fill="#E0E7FF">SMARTER RECRUITMENT  ·  EXPLAINABLE AI  ·  HUMAN-CENTRED HIRING</text>
    </g>

    <!-- scanning line -->
    <rect x="420" y="272" width="360" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.15"/>
    <rect y="271" width="90" height="4" rx="2" fill="#67E8F9" filter="url(#glow)">
      <animate attributeName="x" values="420;690;420" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <!-- shimmer sweep -->
    <rect y="0" width="260" height="360" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-400;1500" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- border -->
    <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#818CF8" stroke-opacity="0.35"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
