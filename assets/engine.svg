<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Match score weights: Skills 50%, Experience 20%, Education 10%, Role similarity 20%" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="b1" x1="0" x2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="b2" x1="0" x2="1"><stop offset="0" stop-color="#0891B2"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="b3" x1="0" x2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <linearGradient id="b4" x1="0" x2="1"><stop offset="0" stop-color="#C026D3"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <filter id="g" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
    .l{font-size:16px;font-weight:600;fill:#E0E7FF}
    .p{font-size:18px;font-weight:800;fill:#fff}
    .h{font-size:13px;letter-spacing:3px;font-weight:600;fill:#67E8F9}
    .f{font-size:14px;fill:#A5B4FC}
  </style>
  <rect width="900" height="330" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="329" rx="23.5" fill="none" stroke="#818CF8" stroke-opacity="0.35"/>
  <text x="40" y="46" class="h">WEIGHTED MATCH MODEL</text>

  <!-- tracks -->
  <g fill="#FFFFFF" fill-opacity="0.06">
    <rect x="200" y="74" width="620" height="28" rx="14"/>
    <rect x="200" y="130" width="620" height="28" rx="14"/>
    <rect x="200" y="186" width="620" height="28" rx="14"/>
    <rect x="200" y="242" width="620" height="28" rx="14"/>
  </g>

  <!-- bars: width = weight% x 12.4 -->
  <rect x="200" y="74" height="28" rx="14" fill="url(#b1)" filter="url(#g)">
    <animate attributeName="width" values="0;620;620;0" keyTimes="0;0.2;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="200" y="130" height="28" rx="14" fill="url(#b2)" filter="url(#g)">
    <animate attributeName="width" values="0;248;248;0" keyTimes="0;0.25;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="200" y="186" height="28" rx="14" fill="url(#b3)" filter="url(#g)">
    <animate attributeName="width" values="0;124;124;0" keyTimes="0;0.3;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="200" y="242" height="28" rx="14" fill="url(#b4)" filter="url(#g)">
    <animate attributeName="width" values="0;248;248;0" keyTimes="0;0.35;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text x="40" y="94" class="l">Skills</text>
  <text x="40" y="150" class="l">Experience</text>
  <text x="40" y="206" class="l">Education</text>
  <text x="40" y="262" class="l">Role similarity</text>

  <text x="836" y="94" class="p">50%</text>
  <text x="462" y="150" class="p">20%</text>
  <text x="338" y="206" class="p">10%</text>
  <text x="462" y="262" class="p">20%</text>

  <text x="450" y="306" text-anchor="middle" class="f">Overall Match = Skills×0.50 + Experience×0.20 + Education×0.10 + Role Similarity×0.20</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
