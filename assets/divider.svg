<svg width="1200" height="24" viewBox="0 0 1200 24" xmlns="http://www.w3.org/2000/svg" role="presentation" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#line)" opacity="0.7"/>
  <circle cy="12" r="4" fill="#67E8F9" filter="url(#g)">
    <animate attributeName="cx" values="60;1140;60" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(600 12)" filter="url(#g)">
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#A78BFA" transform="rotate(45)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
